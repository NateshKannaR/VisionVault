services:
  server:
    build: ./server
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VISIONVAULT_API_TOKEN: ${VISIONVAULT_API_TOKEN:?Set a planner token with at least 32 characters}
      VISIONVAULT_ALLOWED_ORIGINS: ${VISIONVAULT_ALLOWED_ORIGINS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-20}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
