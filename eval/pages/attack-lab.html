<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VisionVault — redaction attack lab</title>
<script src="/extension/lib/tesseract/tesseract.min.js"></script>
</head>
<!--
  The attacker's workbench.

  Loads a redacted capture produced by the extension and tries to read the personal data back
  out of it, using the enhancements anyone would reach for first: upscaling, contrast
  stretching, thresholding, sharpening, inversion. Recognition uses the same bundled Tesseract
  the extension ships, so the attacker is at least as capable as the defender.

  This page holds no assertions. It returns whatever text each attack recovered, and
  eval/attack-redaction.js decides whether any of it was supposed to be secret.
-->
<body>
<script>
/** Draws `img` into a canvas at `scale`, applying a per-pixel transform. */
function transform(img, scale, fn) {
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale);
  c.height = Math.round(img.height * scale);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = scale > 1;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height);
  if (fn) {
    const d = ctx.getImageData(0, 0, c.width, c.height);
    fn(d.data);
    ctx.putImageData(d, 0, 0);
  }
  return c;
}

// Each attack is a plausible attempt to pull signal out of a flattened region. A redaction
// that merely darkened pixels rather than replacing them would give way to one of these.
const ATTACKS = {
  'as-transmitted':      { scale: 1,   fn: null },
  'upscale-2x':          { scale: 2,   fn: null },
  'upscale-4x':          { scale: 4,   fn: null },
  'contrast-stretch':    { scale: 2,   fn: (d) => {
      let lo = 255, hi = 0;
      for (let i = 0; i < d.length; i += 4) {
        const l = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
        if (l < lo) lo = l; if (l > hi) hi = l;
      }
      const span = Math.max(1, hi - lo);
      for (let i = 0; i < d.length; i += 4) {
        for (let k = 0; k < 3; k++) d[i + k] = Math.max(0, Math.min(255, ((d[i + k] - lo) / span) * 255));
      }
    } },
  // The most revealing attack against a weak redaction: any residue at all becomes black.
  'extreme-gain':        { scale: 3,   fn: (d) => {
      for (let i = 0; i < d.length; i += 4) {
        const l = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
        const v = l < 250 && l > 2 ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
    } },
  'invert':              { scale: 2,   fn: (d) => {
      for (let i = 0; i < d.length; i += 4) { d[i] = 255 - d[i]; d[i + 1] = 255 - d[i + 1]; d[i + 2] = 255 - d[i + 2]; }
    } },
};

let workerPromise = null;
function getWorker(base) {
  if (workerPromise) return workerPromise;
  workerPromise = Tesseract.createWorker('eng', 1, {
    workerPath: base + '/extension/lib/tesseract/worker.min.js',
    corePath:   base + '/extension/lib/tesseract/',
    langPath:   base + '/extension/models/tessdata',
    workerBlobURL: false,
    gzip: true,
    logger: () => {},
  });
  return workerPromise;
}

/**
 * Runs every attack against one image and returns the text each recovered.
 * @param {string} dataUrl  the redacted capture, exactly as it would be transmitted
 * @param {string} base     origin serving the extension's bundled Tesseract
 */
window.attack = async function (dataUrl, base) {
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = dataUrl; });
  const worker = await getWorker(base);
  const out = {};
  for (const [name, { scale, fn }] of Object.entries(ATTACKS)) {
    try {
      const canvas = transform(img, scale, fn);
      const { data } = await worker.recognize(canvas);
      out[name] = { text: (data.text || '').replace(/\s+/g, ' ').trim(), ok: true };
    } catch (err) {
      out[name] = { text: '', ok: false, error: String(err && err.message || err) };
    }
  }
  return out;
};

window.attackReady = true;
</script>
</body>
</html>
