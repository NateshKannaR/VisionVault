      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
