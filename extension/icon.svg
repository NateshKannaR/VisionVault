<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="50%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Outer Glow & Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <!-- Inner Shield Depth Gradient -->
    <linearGradient id="shield-inner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#090d18" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#141a2e" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glowing Iris / Lens Gradient -->
    <linearGradient id="iris-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <radialGradient id="pupil-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <!-- Subtle Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Continuous Rounded Squircle -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- Ambient Light Reflection inside Container -->
  <rect x="3" y="3" width="122" height="60" rx="26" fill="white" opacity="0.03"/>

  <!-- Cyber Shield Silhouette (Outer Glow Layer) -->
  <path d="M64 20 L102 38 C102 75 84 100 64 110 C44 100 26 75 26 38 Z" fill="url(#shield-grad)" filter="url(#glow)" opacity="0.4"/>

  <!-- Cyber Shield (Main Structure) -->
  <path d="M64 20 L102 38 C102 75 84 100 64 110 C44 100 26 75 26 38 Z" fill="url(#shield-grad)"/>

  <!-- Inner Vault Shield (Dark Core Chamber) -->
  <path d="M64 26 L96 41 C96 72 80 94 64 103 C48 94 32 72 32 41 Z" fill="url(#shield-inner)" stroke="url(#shield-grad)" stroke-width="1.5"/>

  <!-- Cybernetic Grid / Target Focus Marks -->
  <path d="M46 64 H36 M92 64 H82 M64 46 V36 M64 92 V82" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Futuristic Vision Aperture (Outer Eye Outline) -->
  <path d="M40 64 C48 48 80 48 88 64 C80 80 48 80 40 64 Z" fill="none" stroke="url(#iris-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#core-glow)"/>

  <!-- Inner Glowing Iris Ring -->
  <circle cx="64" cy="64" r="10.5" fill="none" stroke="#00f5ff" stroke-width="2.5" stroke-dasharray="14 3" opacity="0.9"/>

  <!-- Core Radiant Pupil (Laser Lens) -->
  <circle cx="64" cy="64" r="5" fill="url(#pupil-glow)" filter="url(#core-glow)"/>
  <circle cx="64" cy="64" r="2.2" fill="#ffffff"/>

  <!-- Futuristic Corner Highlights -->
  <circle cx="64" cy="31" r="1.5" fill="#00f5ff"/>
</svg>
