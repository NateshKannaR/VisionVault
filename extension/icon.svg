      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>

    <linearGradient id="accent" x1="28" y1="24" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
