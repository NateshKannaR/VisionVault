<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VisionVault — Microphone Access</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --green: #10b981;
      --red: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .icon-wrap {
      width: 64px;
      height: 64px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .icon-wrap svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    #status {
      margin-top: 18px;
      font-size: 13px;
      min-height: 20px;
    }
    #status.success {
      color: var(--green);
      font-weight: 600;
    }
    #status.error {
      color: var(--red);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/>
      </svg>
    </div>
    <h1>Enable Microphone Access</h1>
    <p>
      Chrome requires microphone permission to be granted in a tab before VisionVault can transcribe your voice commands.
    </p>
    <button class="btn" id="allowBtn">
      Allow Microphone
    </button>
    <div id="status"></div>
  </div>

  <script>
    const allowBtn = document.getElementById("allowBtn");
    const statusEl = document.getElementById("status");

    async function requestAccess() {
      statusEl.textContent = "Requesting microphone permission…";
      statusEl.className = "";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
        statusEl.textContent = "✓ Microphone access granted! Closing tab…";
        statusEl.className = "success";
        allowBtn.style.display = "none";
        try {
          chrome.runtime.sendMessage({ type: "MIC_PERMISSION_GRANTED" });
        } catch (_) {}
        setTimeout(() => {
          window.close();
        }, 1200);
      } catch (err) {
        console.warn("Microphone access denied:", err);
        statusEl.textContent = "Microphone was blocked. Please click \"Allow\" in Chrome permission prompt above.";
        statusEl.className = "error";
      }
    }

    allowBtn.addEventListener("click", requestAccess);

    window.addEventListener("DOMContentLoaded", () => {
      requestAccess();
    });
  </script>
</body>
</html>
