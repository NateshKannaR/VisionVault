<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Form 2 — Frequency Allocation</title>
  <style>
    :root { --bg:#050a14; --card:#0d1b2a; --accent:#00b4d8; --text:#e0f2fe; --muted:#7ea8be; --border:#1a3a5c; --input:#0a1628; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .container { width:100%; max-width:560px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:32px; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:rgba(0,180,216,0.12); border:1px solid rgba(0,180,216,0.3); border-radius:20px; font-size:11px; font-weight:700; color:var(--accent); margin-bottom:14px; }
    h1 { font-size:20px; font-weight:700; margin-bottom:6px; }
    .sub { font-size:12px; color:var(--muted); margin-bottom:24px; }
    .section { font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); margin:20px 0 12px; display:flex; align-items:center; gap:8px; }
    .section::after { content:""; flex:1; height:1px; background:var(--border); }
    .fg { margin-bottom:14px; }
    label { display:block; font-size:12px; font-weight:500; color:#b0c4d8; margin-bottom:5px; }
    input, textarea, select { width:100%; padding:10px 13px; background:var(--input); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:13px; outline:none; transition:border-color .15s; }
    input:focus, textarea:focus, select:focus { border-color:var(--accent); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .btn { width:100%; padding:12px; background:linear-gradient(135deg,#00b4d8,#0077b6); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }
    .btn:hover { opacity:.88; }
    .toast { display:none; margin-top:12px; padding:11px 14px; background:rgba(6,214,160,.12); border:1px solid rgba(6,214,160,.3); border-radius:7px; color:#06d6a0; font-size:13px; text-align:center; }
    .back { display:inline-block; margin-bottom:16px; font-size:12px; color:var(--accent); text-decoration:none; }
    .back:hover { text-decoration:underline; }
  </style>
</head>
<body>
<div class="container">
  <a class="back" href="isro-dashboard.html">← Back to Dashboard</a>
  <div class="badge">📄 Form 2 of 5</div>
  <h1>Frequency Allocation Request</h1>
  <p class="sub">Apply for ITU frequency band allocation for satellite operations.</p>

  <form onsubmit="handleSubmit(event)">
    <div class="section">Satellite &amp; Frequency</div>
    <div class="fg">
      <label for="f2_sat">Satellite Name</label>
      <input type="text" id="f2_sat" name="satellite_name" autocomplete="off" placeholder="Satellite name" data-vault-key="satellite_name" />
    </div>
    <div class="fg">
      <label for="f2_mid">Mission ID</label>
      <input type="text" id="f2_mid" name="mission_id" autocomplete="off" placeholder="Mission ID" data-vault-key="mission_id" />
    </div>
    <div class="fg">
      <label for="f2_freq">Ground Station Frequency</label>
      <input type="text" id="f2_freq" name="ground_station_freq" autocomplete="off" placeholder="e.g. 14.250 GHz (Ku-Band)" data-vault-key="ground_station_freq" />
    </div>
    <div class="grid2">
      <div class="fg">
        <label for="f2_orbit">Orbit Type</label>
        <input type="text" id="f2_orbit" name="orbit_type" autocomplete="off" placeholder="Orbit type" data-vault-key="orbit_type" />
      </div>
      <div class="fg">
        <label for="f2_ld">Launch Date</label>
        <input type="text" id="f2_ld" name="launch_date" autocomplete="off" placeholder="YYYY-MM-DD" data-vault-key="launch_date" />
      </div>
    </div>

    <div class="section">TLE Data</div>
    <div class="fg">
      <label for="f2_tle1">TLE Line 1</label>
      <input type="text" id="f2_tle1" name="tle_line_1" autocomplete="off" placeholder="TLE Line 1" data-vault-key="tle_line_1" style="font-family:monospace;font-size:11px;" />
    </div>
    <div class="fg">
      <label for="f2_tle2">TLE Line 2</label>
      <input type="text" id="f2_tle2" name="tle_line_2" autocomplete="off" placeholder="TLE Line 2" data-vault-key="tle_line_2" style="font-family:monospace;font-size:11px;" />
    </div>

    <div class="section">Applicant</div>
    <div class="fg">
      <label for="f2_op">Operator Name</label>
      <input type="text" id="f2_op" name="operator" autocomplete="name" placeholder="Operator name" data-vault-key="operator" />
    </div>
    <div class="fg">
      <label for="f2_email">Contact Email</label>
      <input type="email" id="f2_email" name="email" autocomplete="email" placeholder="Email address" data-vault-key="email" />
    </div>

    <button type="submit" class="btn">Submit Frequency Allocation Request</button>
    <div class="toast" id="toast">✓ Frequency allocation request submitted!</div>
  </form>
</div>
<script>
  function handleSubmit(e) {
    e.preventDefault();
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 4000);
  }
</script>
</body>
</html>
